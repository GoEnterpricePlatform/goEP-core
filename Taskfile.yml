version: "3"

env:
  STATIC_DIR: "web/web-app/resources/static"

dotenv: ['.env']

tasks:
  # The `Run:` tasks below are used together for development builds and will live-reload the server
  run:templ:
    cmds:
      - go tool templ generate -watch

  run:ts:compiler:
    cmds:
      - go run cmd/api/env/dev/ts-compiler/main.go -watch
  
  run:web:styles:
    cmds:
      - go tool gotailwind -i web/web-app/src/css/app.css -o $STATIC_DIR/css/app.css

  run:server:
    cmds:
      - |
        go tool air  \
         {{if eq OS "windows"}}-build.cmd "go build -tags=dev -o tmp/bin/main.exe ./cmd/api/env/dev/main/main.go" \
          -build.entrypoint "tmp/bin/main.exe"{{end}}
         {{if eq OS "linux"}}-build.cmd "go build -tags=dev -o tmp/bin/main ./cmd/api/env/dev/main/main.go" \
          -build.entrypoint "tmp/bin/main"{{end}} \
         -build.entrypoint "tmp/bin/main" \
         -build.exclude_dir "web" \
         -build.include_ext "go,templ" \
         -misc.clean_on_exit "true"

  run:
    deps:
      - run:ts:compiler
      - run:web:styles
      - run:templ
      - run:server

  # Start only the API and expose it through a temporary Cloudflare Quick Tunnel.
  run:tunnel:
    deps:
      #- run:back:server
      - run:back:tunnel
    failfast: true

  run:back:server:
    cmds:
      - go run cmd/api/env/dev/main/main.go

  run:back:tunnel:
    cmds:
      - cloudflared tunnel --url http://localhost:${HTTP_SERVER_PORT:-8000}

  build:templ:
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"
  
  build:web:styles:
    cmds:
      - go tool gotailwind -i web/web-app/src/css/app.css -o $STATIC_DIR/css/app.css
    
    # These are all the files that can affect your generated CSS.
    sources:
      - "./web/web-app/src/css/**/*.css"
      - "./web/web-app/src/ui/**/*.templ"
      - "./web/web-app/modules/**/*.templ"
    generates:
      - "{{.STATIC_DIR}}/css/app.css"


  build:ts:compiler:
    cmds:
      - go run cmd/api/env/dev/ts-compiler/main.go
    sources:
      - "./web/web-app/src/ts/**/*.ts"
    generates:
      - "./web/web-app/resources/static/js/**/*.js"

  build:
    # We could also use goep-core.exe
    # go build -o goep-core.exe main.go

    cmds:
    - |
      {{if eq OS "windows"}}
      go build -tags=prod -o bin/main.exe ./cmd/api/env/prod
      {{else}}
      go build -tags=prod -o bin/main ./cmd/api/env/prod
      {{end}}

  deps:
    - build:templ
    - build:web:styles
    - build:ts:compiler

  run:build:
    cmds:
      - |
        {{if eq OS "windows"}}
        ./bin/main.exe
        {{else}}
        ./bin/main
        {{end}}
    deps:
      - build

  default:
    cmds:
      - task: run
