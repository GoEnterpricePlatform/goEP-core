{{define "base"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #e5e7eb;
        color: #111827;
        display: flex;
        justify-content: center;
        padding: 40px 20px 120px 20px;
      }

      .container {
        width: 720px;
        max-width: 100%;
      }

      .prompt-wrapper {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 720px;
        max-width: calc(100% - 40px);
      }

      .prompt-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f3f4f6;
        padding: 12px 16px;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
      }

      .prompt-box input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 15px;
        outline: none;
        color: #111827;
      }

      .send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: #111827;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .error {
        margin-top: 20px;
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="container">
      {{if .Error}}
      <div class="error">{{.Error}}</div>
      {{end}} {{block "content" .}}{{end}}
    </div>

    <!-- Prompt fijo -->
    <div class="prompt-wrapper">
      <form method="POST" action="/v1/admin/assistant">
        <div class="prompt-box">
          <input
            type="text"
            name="prompt"
            value="{{.Prompt}}"
            placeholder="Escribe un comando..."
            required
          />

          <button type="submit" class="send-btn">↑</button>
        </div>
      </form>
    </div>
  </body>
</html>
{{end}}
