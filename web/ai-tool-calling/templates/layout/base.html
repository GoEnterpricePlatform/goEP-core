{{define "base"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assistant</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #e5e7eb;
        color: #111827;
        display: flex;
        justify-content: center;
        padding: 80px 20px;
      }

      .container {
        width: 720px;
        max-width: 100%;
      }

      .prompt-box {
        display: flex;
        align-items: center;
        gap: 12px;
        background: #f3f4f6;
        padding: 12px 16px;
        border-radius: 16px;
      }

      .prompt-box input {
        flex: 1;
        border: none;
        background: transparent;
        font-size: 15px;
        outline: none;
        color: #111827;
      }

      .send-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: none;
        background: #111827;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }

      .generated {
        margin-top: 40px;
      }

      .generated h2 {
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 20px;
        color: #6b7280;
      }

      .field {
        margin-bottom: 14px;
      }

      .field input,
      .field textarea {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: none;
        background: #f3f4f6;
        font-size: 14px;
        outline: none;
      }

      .confirm {
        margin-top: 10px;
        background: #111827;
        color: #ffffff;
        border: none;
        border-radius: 14px;
        padding: 12px 20px;
        font-size: 14px;
        cursor: pointer;
      }

      .error {
        margin-top: 20px;
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Prompt -->
      <form method="POST" action="/v1/admin/assistant">
        <div class="prompt-box">
          <input
            type="text"
            name="prompt"
            value="{{.Prompt}}"
            placeholder="Escribe un comando..."
            required
          />

          <button type="submit" class="send-btn">↑</button>
        </div>
      </form>

      {{if .Error}}
      <div class="error">{{.Error}}</div>
      {{end}}  {{block "content" .}}{{end}}
    </div>
  </body>
</html>
{{end}}
