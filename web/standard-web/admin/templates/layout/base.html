{{define "base"}}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · {{template "title"}}</title>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9fafb;
        color: #1f2937;
      }

      /* ---------- LAYOUT ---------- */
      .layout {
        display: flex;
        min-height: 100vh;
      }

      /* ---------- MAIN ---------- */
      main {
        flex: 1;
        width: 100%;
        margin: 0;
        padding: 0;
      }

      .page-header {
        margin-bottom: 30px;
      }

      .page-header h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 600;
      }

      /* ---------- PAGE HEADER ---------- */
      .page-header {
        background-color: #ffffff;
        border-bottom: 1px solid #e5e7eb;
      }

      .page-header-inner {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px 20px;
      }

      .page-header-inner h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }

      /* ---------- PAGE BODY ---------- */
      .page-body {
        max-width: 1200px;
        margin: 30px auto;
        padding: 0 20px;
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 768px) {
        .layout {
          flex-direction: column;
        }

        main {
          margin: 20px auto;
        }
      }

      .header-flex {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .assistant-btn {
        text-decoration: none;
        background: #111827;
        color: white;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s ease;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      }

      .assistant-btn:hover {
        background: #374151;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <!-- SIDEBAR -->
      {{template "sidebar" .}}

      <!-- MAIN CONTENT -->
      <main>
        <!-- PAGE HEADER -->
        <div class="page-header">
          <div class="page-header-inner header-flex">
            <h1>{{template "title"}}</h1>
            <a href="/v1/admin/assistant" class="assistant-btn">
              ✨ Assistant
            </a>
          </div>
        </div>

        <!-- PAGE BODY -->
        <div class="page-body">
          {{block "content" .}}
          <p>No hay content</p>
          {{end}}
        </div>
      </main>
    </div>
  </body>
</html>
{{end}}
